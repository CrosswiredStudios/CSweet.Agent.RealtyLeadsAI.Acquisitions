name: Release reviewed source
on:
  push:
    branches: [main]
    paths:
      - 'csweet-plugin.json'
      - 'releases/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Validate release
        run: |
          dotnet test
          dotnet run --project src/CSweet.Agent.RealtyLeadsAI.Acquisitions -- --self-test
      - name: Publish immutable source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r '.version' csweet-plugin.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="releases/$version.md"
          test -f "$notes"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')" = "$GITHUB_SHA"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$version" --notes-file "$notes"
          fi
