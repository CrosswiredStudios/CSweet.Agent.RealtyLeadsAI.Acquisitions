name: Agent checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Verify CI dependency fallback
        env:
          CSWEET_RUN_DEPENDENCY_INTEGRATION: '1'
        run: python3 scripts/test-ci-dependencies.py
      - name: Prepare pinned C-Sweet dependencies
        env:
          CSWEET_DEPENDENCY_TOKEN: ${{ secrets.CSWEET_DEPENDENCY_READ_TOKEN }}
        run: python3 scripts/prepare-ci-dependencies.py
      - run: dotnet test
      - run: dotnet run --project src/CSweet.Agent.RealtyLeadsAI.Acquisitions -- --self-test
      - name: Upload dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-ci-dependencies
          path: .artifacts/ci-dependencies/resolved.json
          if-no-files-found: ignore
